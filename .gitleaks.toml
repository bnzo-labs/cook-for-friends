[extend]
useDefault = true

[allowlist]
description = "Known safe patterns"
paths = [
  # Example env file — all values are intentionally empty
  "apps/web/.env.example",
  # Test fixtures — uses fictional data (@example.com)
  "apps/web/test/lint-fixtures/.*",
  # Lockfile — no secrets, just package hashes
  "pnpm-lock.yaml",
]
